<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 250" role="img" aria-label="Intello logo dark mode"><rect width="910" height="250" rx="22" fill="#0B1B4F"/><svg x="0" y="0" width="260" height="250" viewBox="0 0 260 250">
<title id="title">Intello Knowledge Prism</title><desc id="desc">Two translucent knowledge layers converge into a blue and teal prism with a white letter I.</desc>
<defs>
 <linearGradient id="rear1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BCC7FF" stop-opacity=".93"/><stop offset="1" stop-color="#9EB5FF" stop-opacity=".52"/></linearGradient>
 <linearGradient id="rear2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9A9CFA" stop-opacity=".83"/><stop offset="1" stop-color="#697FFA" stop-opacity=".70"/></linearGradient>
 <linearGradient id="bluefront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#064FEA"/><stop offset=".47" stop-color="#1268FC"/><stop offset="1" stop-color="#0B42D8"/></linearGradient>
 <linearGradient id="tealface" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#09BCE9"/><stop offset=".37" stop-color="#08BBAE"/><stop offset="1" stop-color="#029D92"/></linearGradient>
 <linearGradient id="topfacet" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#0E73F4"/><stop offset=".65" stop-color="#40DDE3"/><stop offset="1" stop-color="#55F0CC"/></linearGradient>
 <linearGradient id="lowerfacet" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#0870F0"/><stop offset=".62" stop-color="#12D4E0"/><stop offset="1" stop-color="#04BEAE"/></linearGradient>
</defs>
