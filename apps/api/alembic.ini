# Alembic configuration for the UKOS API (M01.02.01).
#
# Migrations run as the ADMIN role (DATABASE_MIGRATION_URL), never as the app role. The app role
# that receives table grants comes from `-x app_role=<name>` or env POSTGRES_APP_USER
# (default ukos_app). The database URL is read in migrations/env.py; it is deliberately not
# stored here.
#
#   cd apps/api
#   DATABASE_MIGRATION_URL=postgresql+psycopg://ukos_admin:...@127.0.0.1:5532/ukos \
#     uv run --no-sync python -m alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
