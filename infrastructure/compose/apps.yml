# Universal Knowledge OS — application services (M00.02.05)
#
# FastAPI (`api`, after the one-shot `api-migrate`) and Next.js (`web`) starters. Depends on the `postgres` and `redis` services
# from data.yml, so a standalone run must include both files:
#
#   docker compose -p ukos-platform --env-file infrastructure/env/.env.example \
#     -f infrastructure/compose/data.yml -f infrastructure/compose/apps.yml up -d --build --wait
#
# Conventions: default network only, no restart policy (local dev), host ports bound to
# ${UKOS_BIND_HOST} (127.0.0.1) only. Each service receives only the variables it needs.

services:
  # One-shot schema migration (M01.02.01): same image as `api`, runs Alembic as the ADMIN role
  # and grants table privileges to POSTGRES_APP_USER. `api` starts only after it exits 0.
  api-migrate:
    build:
      context: ../../apps/api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      # Migration 0005 creates the worker role (M03 contract §4) from this password.
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER:-ukos_worker}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD is required}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../../apps/api
    # Local inference (LM Studio, DC-011) runs on the host; this mapping makes
    # host.docker.internal resolve on Linux too (Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      UKOS_ENV: ${UKOS_ENV:-local}
      UKOS_LOG_LEVEL: ${UKOS_LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY is required}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://127.0.0.1:8380/dex}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://dex:5556/dex}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ukos-api}
      # Uploads and quotas (M02 contract section 3).
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-104857600}
      ORG_STORAGE_QUOTA_BYTES: ${ORG_STORAGE_QUOTA_BYTES:-5368709120}
      UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-3600}
      UPLOAD_MAX_PENDING_PER_USER: ${UPLOAD_MAX_PENDING_PER_USER:-20}
      DOCUMENT_PURGE_GRACE_DAYS: ${DOCUMENT_PURGE_GRACE_DAYS:-7}
      # Object storage (M02 contract section 2); the adapter reads these itself.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://objectstore:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9300}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET_ORIGINALS: ${S3_BUCKET_ORIGINALS:-ukos-originals}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-ukos-artifacts}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-300}
      # Ingestion (M03 contract §2, §7, §10): finalize enqueues a job for the configured embedding space.
      INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-5}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-google/embedding-gemma-300m}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-768}
      AI_EMBEDDING_QUERY_PREFIX: "${AI_EMBEDDING_QUERY_PREFIX:-task: search result | query: }"
      AI_EMBEDDING_DOCUMENT_PREFIX: "${AI_EMBEDDING_DOCUMENT_PREFIX:-title: none | text: }"
      AI_EMBEDDING_SPEC_VERSION: ${AI_EMBEDDING_SPEC_VERSION:-1}
      # Search runs in the API (M04): the knowledge index and the embedding server (query vectors).
      RUSHDB_URL: ${RUSHDB_URL:-http://rushdb:3000}
      RUSHDB_TOKEN: ${RUSHDB_TOKEN:?RUSHDB_TOKEN is required}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:1234/v1}
      # Search, chat, verification and external-provider gating (M04 contract §11).
      SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-10}
      SEARCH_CANDIDATES: ${SEARCH_CANDIDATES:-50}
      SEARCH_MAX_PER_DOCUMENT: ${SEARCH_MAX_PER_DOCUMENT:-3}
      SEARCH_RATE_PER_MIN: ${SEARCH_RATE_PER_MIN:-60}
      CHAT_MODEL: ${CHAT_MODEL:-${AI_CHAT_MODEL:-google/gemma-3-4b}}
      CHAT_CONTEXT_TOKENS: ${CHAT_CONTEXT_TOKENS:-4096}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-800}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.0}
      CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS:-6}
      CHAT_RUN_TIMEOUT_SECONDS: ${CHAT_RUN_TIMEOUT_SECONDS:-180}
      CHAT_MAX_RUNS_PER_MIN: ${CHAT_MAX_RUNS_PER_MIN:-10}
      CHAT_MAX_CONCURRENT_RUNS: ${CHAT_MAX_CONCURRENT_RUNS:-2}
      VERIFY_MODE: ${VERIFY_MODE:-strict}
      VERIFY_LEXICAL_MIN: ${VERIFY_LEXICAL_MIN:-0.35}
      VERIFY_EMBED_MIN: ${VERIFY_EMBED_MIN:-0.55}
      AI_EXTERNAL_PROVIDERS_ENABLED: ${AI_EXTERNAL_PROVIDERS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
    ports:
      - "${UKOS_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-8300}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8300}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8300}
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8000}
      # Web session / BFF (M01.01.02, contract §6, DC-017).
      UKOS_ENV: ${UKOS_ENV:-local}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?OIDC_ISSUER_URL is required}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://dex:5556/dex}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ukos-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-ukos-api}
      OIDC_REDIRECT_URIS: ${OIDC_REDIRECT_URIS:-http://127.0.0.1:3300/api/auth/callback}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://127.0.0.1:3300}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?WEB_SESSION_SECRET is required}
    ports:
      - "${UKOS_BIND_HOST:-127.0.0.1}:${WEB_HOST_PORT:-3300}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
