# Universal Knowledge OS — application services (M00.02.05)
#
# FastAPI (`api`) and Next.js (`web`) starters. Depends on the `postgres` and `redis` services
# from data.yml, so a standalone run must include both files:
#
#   docker compose -p ukos-platform --env-file infrastructure/env/.env.example \
#     -f infrastructure/compose/data.yml -f infrastructure/compose/apps.yml up -d --build --wait
#
# Conventions: default network only, no restart policy (local dev), host ports bound to
# ${UKOS_BIND_HOST} (127.0.0.1) only. Each service receives only the variables it needs.

services:
  api:
    build:
      context: ../../apps/api
    # Local inference (LM Studio, DC-011) runs on the host; this mapping makes
    # host.docker.internal resolve on Linux too (Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      UKOS_ENV: ${UKOS_ENV:-local}
      UKOS_LOG_LEVEL: ${UKOS_LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY is required}
    ports:
      - "${UKOS_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-8300}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8300}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8300}
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8000}
    ports:
      - "${UKOS_BIND_HOST:-127.0.0.1}:${WEB_HOST_PORT:-3300}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
