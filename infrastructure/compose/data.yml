# Universal Knowledge OS — data services (M00.02.01)
#
# PostgreSQL (authoritative operational DB, ADR-013) and Redis (Celery broker only, ADR-036).
# Works standalone and when merged by the root compose.yaml via `include`:
#
#   docker compose -p ukos-platform --env-file infrastructure/env/.env.example \
#     -f infrastructure/compose/data.yml up -d --wait
#
# Conventions: default network only, no restart policy (local dev), host ports bound to
# ${UKOS_BIND_HOST} (127.0.0.1) only. Passwords reach the containers as Compose secrets
# (files under /run/secrets), so they do not appear in `docker inspect` Env/Cmd/Healthcheck.

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_password
      - postgres_app_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${UKOS_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5532}:5432"
    healthcheck:
      # TCP check (-h 127.0.0.1) so the socket-only init server is never reported healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    secrets:
      - redis_password
    # The password is fed to redis-server as config on stdin (`redis-server -`), so it is not
    # visible in the container command line, `ps`, or `docker inspect`.
    command:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh redis-server - --appendonly yes --dir /data <<CONF
        requirepass "$$(cat /run/secrets/redis_password)"
        CONF
    volumes:
      - redis-data:/data
    ports:
      - "${UKOS_BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6479}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli -h 127.0.0.1 ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  postgres_app_password:
    environment: POSTGRES_APP_PASSWORD
  redis_password:
    environment: REDIS_PASSWORD

volumes:
  postgres-data:
  redis-data:
