# M08.03.01 CI gates. Free GitHub-hosted runners, NO secrets, read-only token.
# Every command here is reproduced locally by scripts/ci/run_local.sh (keep the two in sync).
# DB/RLS integration suites start their own compose projects, so they live in nightly.yml (see docs/release/CI.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (ruff, mypy strict, unit tests, openapi snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: ruff (app; blocking)
        run: |
          uv run python -m ruff check .
          uv run python -m ruff format --check .
      - name: ruff on repo tests (advisory: 72 pre-existing findings in other owners' trees, docs/execution/TEST_DEBT.md)
        continue-on-error: true
        run: |
          uv run python -m ruff check --config ../../tests/ruff.toml ../../tests
          uv run python -m ruff format --config ../../tests/ruff.toml --check ../../tests
      - name: mypy strict
        run: uv run python -m mypy app tests migrations
      - name: unit tests (includes the OpenAPI snapshot contract test)
        run: uv run python -m pytest -q -p no:cacheprovider tests

  eval:
    name: evaluation gate (offline, baseline required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python ../../tests/evaluation/run_eval.py --require-baseline
      - run: uv run python ../../tests/evaluation/run_eval.py --require-baseline --metrics && uv run python ../../tests/evaluation/budgets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: tests/evaluation/reports/
          if-no-files-found: ignore

  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: validate the stack against the example env (placeholders only)
        run: |
          cp infrastructure/env/.env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml config --quiet

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/secret_scan.py

  audit:
    name: dependency audit (report; fail on critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: pip-audit (Python)
        run: |
          cd apps/api
          uv export --frozen --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip --format json -o /tmp/pip-audit.json || true
          python3 ../../scripts/ci/audit_gate.py pip /tmp/pip-audit.json
      - name: npm audit (web, production deps)
        run: |
          cd apps/web
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          python3 ../../scripts/ci/audit_gate.py npm /tmp/npm-audit.json
